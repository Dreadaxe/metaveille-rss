name: MetaVeille — Collecte commentaires dimanche

on:
  schedule:
    - cron: '0 19 * * 0'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metaveille-weekly-comments
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Démarrer une seule collecte Apify par semaine
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_COMMENTS_TASK_ID: ${{ vars.APIFY_COMMENTS_TASK_ID }}
        run: python start_weekly_comments.py
