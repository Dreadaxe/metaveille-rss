name: Audit Apify publications (lecture seule)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Examiner les paramètres du dernier run (sans secrets)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python audit_apify_input.py
      - name: Analyser le dernier dataset Apify existant
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python audit_apify_posts.py
